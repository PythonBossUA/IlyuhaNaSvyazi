<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ілюха на связі!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --bg-input: #0f3460;
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #00d9ff;
            --accent-hover: #00b8d4;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --border: #27272a;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Status */
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--warning);
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: var(--success);
        }

        .status-dot.error {
            background: var(--error);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Messages container */
        .messages-wrapper {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 24px var(--shadow);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* Message items */
        .message {
            display: flex;
            flex-direction: column;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            align-items: flex-end;
        }

        .message.received {
            align-items: flex-start;
        }

        .message.system {
            align-items: center;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, var(--accent), #0099cc);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.received .message-bubble {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .message.system .message-bubble {
            background: transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
            padding: 6px 12px;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            padding: 0 4px;
        }

        /* Input form */
        .input-form {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            border-radius: 0 0 16px 16px;
        }

        .input-form input {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-form input::placeholder {
            color: var(--text-muted);
        }

        .input-form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
        }

        .input-form input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-form button {
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--accent), #0099cc);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .input-form button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 217, 255, 0.3);
        }

        .input-form button:active:not(:disabled) {
            transform: translateY(0);
        }

        .input-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Auth overlay */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 35, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .auth-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 32px var(--shadow);
        }

        .auth-card h2 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .auth-field {
            margin-bottom: 16px;
        }

        .auth-field label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .auth-field input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .auth-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
        }

        .auth-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), #0099cc);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }

        .auth-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 217, 255, 0.3);
        }

        .auth-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }

        .auth-error.visible {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        /* Error message */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }

        .error-message.visible {
            display: block;
            animation: slideIn 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                height: calc(100vh - 20px);
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .message-bubble {
                max-width: 85%;
            }

            .input-form {
                padding: 12px;
            }

            .input-form button {
                padding: 14px 20px;
            }

            .auth-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ілюха на связі!</h1>
            <p class="subtitle">Алгоритми шифрування ECDH + AES-GCM</p>
        </div>

        <div class="status" id="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Підключення...</span>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="messages-wrapper">
            <div class="messages" id="messages"></div>

            <form class="input-form" onsubmit="sendMessage(event)">
                <input
                    type="text"
                    id="messageText"
                    placeholder="Сюда пиши"
                    autocomplete="off"
                    disabled
                />
                <button type="submit" id="sendButton" disabled>Відправити</button>
            </form>
        </div>
    </div>

    <!-- Auth Overlay -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <h2 id="authTitle">Авторизація</h2>

            <div class="auth-error" id="authError"></div>

            <!-- Login Form -->
            <div id="loginForm">
                <div class="auth-field">
                    <label for="loginInput">Логін</label>
                    <input type="text" id="loginInput" autocomplete="username" />
                </div>

                <div class="auth-field">
                    <label for="passwordInput">Пароль</label>
                    <input type="password" id="passwordInput" autocomplete="current-password" />
                </div>

                <button class="auth-button" id="loginButton" onclick="sendAuthorization()">
                    Увійти
                </button>
            </div>

            <!-- Password Change Form -->
            <div id="passwordChangeForm" class="hidden">
                <div class="auth-field">
                    <label for="newPasswordInput">Новий пароль</label>
                    <input type="password" id="newPasswordInput" autocomplete="new-password" />
                </div>

                <div class="auth-field">
                    <label for="confirmPasswordInput">Підтвердіть новий пароль</label>
                    <input type="password" id="confirmPasswordInput" autocomplete="new-password" />
                </div>

                <button class="auth-button" id="changePasswordButton" onclick="sendPasswordChange()">
                    Змінити пароль
                </button>
            </div>
        </div>
    </div>

    <script>
        const clientId = "{{ client_id }}";
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws/${clientId}`;

        let aesKey = null;
        let myKeyPair = null;
        let isAuthenticated = false;

        const enc = new TextEncoder();
        const dec = new TextDecoder();

        // ============================================================
        // Утиліти для Base64
        // ============================================================

        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        function base64ToArrayBuffer(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // ============================================================
        // Генерація ECDH P-256 ключів
        // ============================================================

        async function generateEcdhKeyPair() {
            return await crypto.subtle.generateKey(
                {
                    name: "ECDH",
                    namedCurve: "P-256"
                },
                true,
                ["deriveBits"]
            );
        }

        async function exportPublicJwk(keyPair) {
            const jwk = await crypto.subtle.exportKey("jwk", keyPair.publicKey);
            return {
                kty: jwk.kty,
                crv: jwk.crv,
                x: jwk.x,
                y: jwk.y
            };
        }

        async function importPublicJwk(jwk) {
            return await crypto.subtle.importKey(
                "jwk",
                jwk,
                {
                    name: "ECDH",
                    namedCurve: "P-256"
                },
                false,
                []
            );
        }

        // ============================================================
        // Виведення AES-ключа через ECDH + HKDF
        // ============================================================

        async function deriveAesKey(privateKey, peerPublicKey, saltStr, infoStr) {
            const sharedSecretBits = await crypto.subtle.deriveBits(
                {
                    name: "ECDH",
                    public: peerPublicKey
                },
                privateKey,
                256
            );

            const hkdfKey = await crypto.subtle.importKey(
                "raw",
                sharedSecretBits,
                "HKDF",
                false,
                ["deriveKey"]
            );

            return await crypto.subtle.deriveKey(
                {
                    name: "HKDF",
                    hash: "SHA-256",
                    salt: enc.encode(saltStr),
                    info: enc.encode(infoStr)
                },
                hkdfKey,
                {
                    name: "AES-GCM",
                    length: 256
                },
                false,
                ["encrypt", "decrypt"]
            );
        }

        // ============================================================
        // Шифрування / розшифрування
        // ============================================================

        function makeRandomNonce() {
            const nonce = new Uint8Array(12);
            crypto.getRandomValues(nonce);
            return nonce;
        }

        async function encryptText(text) {
            if (!aesKey) {
                throw new Error("AES ключ ще не виведено");
            }

            const nonce = makeRandomNonce();
            const aad = enc.encode(`client_id=${clientId}|v=1`);

            const ciphertext = await crypto.subtle.encrypt(
                {
                    name: "AES-GCM",
                    iv: nonce,
                    additionalData: aad
                },
                aesKey,
                enc.encode(text)
            );

            const result = new Uint8Array(nonce.length + ciphertext.byteLength);
            result.set(nonce, 0);
            result.set(new Uint8Array(ciphertext), nonce.length);

            return arrayBufferToBase64(result.buffer);
        }

        async function decryptText(base64Packet) {
            if (!aesKey) {
                throw new Error("AES ключ ще не виведено");
            }

            const packet = new Uint8Array(base64ToArrayBuffer(base64Packet));
            const nonce = packet.slice(0, 12);
            const ciphertext = packet.slice(12);

            const aad = enc.encode(`client_id=${clientId}|v=1`);

            const plaintext = await crypto.subtle.decrypt(
                {
                    name: "AES-GCM",
                    iv: nonce,
                    additionalData: aad
                },
                aesKey,
                ciphertext
            );

            return dec.decode(plaintext);
        }

        // ============================================================
        // UI функції
        // ============================================================

        function updateStatus(text, state = 'connecting') {
            const statusText = document.getElementById("statusText");
            const statusDot = document.getElementById("statusDot");

            statusText.textContent = text;
            statusDot.className = "status-dot";

            if (state === 'connected') {
                statusDot.classList.add('connected');
            } else if (state === 'error') {
                statusDot.classList.add('error');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById("errorMessage");
            errorDiv.textContent = message;
            errorDiv.classList.add('visible');

            setTimeout(() => {
                errorDiv.classList.remove('visible');
            }, 5000);
        }

        function showAuthError(message) {
            const errorDiv = document.getElementById("authError");
            errorDiv.textContent = message;
            errorDiv.classList.add('visible');
        }

        function hideAuthError() {
            const errorDiv = document.getElementById("authError");
            errorDiv.classList.remove('visible');
        }

        function getTimeString() {
            return new Date().toLocaleTimeString('uk-UA', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function addMessage(text, type = 'received') {
            const messages = document.getElementById("messages");

            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${type}`;

            const bubble = document.createElement("div");
            bubble.className = "message-bubble";
            bubble.textContent = text;

            const time = document.createElement("div");
            time.className = "message-time";
            time.textContent = getTimeString();

            messageDiv.appendChild(bubble);
            messageDiv.appendChild(time);
            messages.appendChild(messageDiv);

            messages.scrollTop = messages.scrollHeight;
        }

        function addSystemMessage(text) {
            const messages = document.getElementById("messages");

            const messageDiv = document.createElement("div");
            messageDiv.className = "message system";

            const bubble = document.createElement("div");
            bubble.className = "message-bubble";
            bubble.textContent = text;

            messageDiv.appendChild(bubble);
            messages.appendChild(messageDiv);

            messages.scrollTop = messages.scrollHeight;
        }

        function setInputEnabled(enabled) {
            document.getElementById("messageText").disabled = !enabled;
            document.getElementById("sendButton").disabled = !enabled;
        }

        function showAuthOverlay() {
            document.getElementById("authOverlay").classList.remove("hidden");
        }

        function hideAuthOverlay() {
            document.getElementById("authOverlay").classList.add("hidden");
        }

        function showLoginForm() {
            document.getElementById("loginForm").classList.remove("hidden");
            document.getElementById("passwordChangeForm").classList.add("hidden");
            document.getElementById("authTitle").textContent = "Авторизація";
            hideAuthError();
        }

        function showPasswordChangeForm() {
            document.getElementById("loginForm").classList.add("hidden");
            document.getElementById("passwordChangeForm").classList.remove("hidden");
            document.getElementById("authTitle").textContent = "Зміна пароля";
            hideAuthError();
        }

        // ============================================================
        // Відправка авторизації
        // ============================================================

        async function sendAuthorization() {
            hideAuthError();

            const login = document.getElementById("loginInput").value.trim();
            const password = document.getElementById("passwordInput").value;

            if (!login) {
                showAuthError("Введіть логін");
                return;
            }

            if (!password) {
                showAuthError("Введіть пароль");
                return;
            }

            if (!aesKey) {
                showAuthError("Шифрування ще не налаштовано");
                return;
            }

            try {
                const encryptedPassword = await encryptText(password);

                ws.send(JSON.stringify({
                    type: "authorization",
                    login: login,
                    password: encryptedPassword
                }));

                document.getElementById("loginButton").disabled = true;
                updateStatus("Авторизація...", "connecting");

            } catch (error) {
                showAuthError("Помилка шифрування: " + error.message);
                console.error(error);
            }
        }

        // ============================================================
        // Відправка зміни пароля
        // ============================================================

        async function sendPasswordChange() {
            hideAuthError();

            const newPassword = document.getElementById("newPasswordInput").value;
            const confirmPassword = document.getElementById("confirmPasswordInput").value;

            if (!newPassword) {
                showAuthError("Введіть новий пароль");
                return;
            }

            if (newPassword.length < 6) {
                showAuthError("Пароль має бути не менше 6 символів");
                return;
            }

            if (newPassword !== confirmPassword) {
                showAuthError("Паролі не співпадають");
                return;
            }

            if (!aesKey) {
                showAuthError("Шифрування ще не налаштовано");
                return;
            }

            try {
                const encryptedPassword = await encryptText(newPassword);

                ws.send(JSON.stringify({
                    type: "password_change",
                    new_password: encryptedPassword
                }));

                document.getElementById("changePasswordButton").disabled = true;
                updateStatus("Зміна пароля...", "connecting");

            } catch (error) {
                showAuthError("Помилка шифрування: " + error.message);
                console.error(error);
            }
        }

        // ============================================================
        // WebSocket
        // ============================================================

        const ws = new WebSocket(wsUrl);

        ws.onopen = async function() {
            updateStatus("Підключено, виконується рукостискання...", "connecting");

            try {
                myKeyPair = await generateEcdhKeyPair();
                const myPublicJwk = await exportPublicJwk(myKeyPair);

                ws.send(JSON.stringify({
                    type: "public_key",
                    jwk: myPublicJwk
                }));

            } catch (error) {
                updateStatus("Помилка: " + error.message, "error");
                showError(error.message);
                console.error(error);
            }
        };

        ws.onmessage = async function(event) {
            try {
                const message = JSON.parse(event.data);

                // Публічний ключ сервера
                if (message.type === "public_key") {
                    const serverPublicKey = await importPublicJwk(message.jwk);

                    aesKey = await deriveAesKey(
                        myKeyPair.privateKey,
                        serverPublicKey,
                        clientId,
                        "ilyuha-na-svyazi|v1|aes-gcm-256"
                    );

                    addSystemMessage("🔐 Рукостискання завершено");
                }

                // Підтвердження handshake
                else if (message.type === "handshake_ok") {
                    updateStatus("Очікується авторизація", "connecting");
                    addSystemMessage("✅ Безпечне з'єднання встановлено");
                }

                // Помилка авторизації
                else if (message.type === "auth_error") {
                    showAuthError(message.message || "Невідома помилка авторизації");
                    document.getElementById("loginButton").disabled = false;
                    updateStatus("Помилка авторизації", "error");
                    addSystemMessage("❌ " + (message.message || "Помилка авторизації"));
                }

                // Потреба зміни пароля
                else if (message.type === "need_password_change") {
                    updateStatus("Потрібна зміна пароля", "connecting");
                    addSystemMessage("⚠️ Необхідно змінити пароль");
                    showPasswordChangeForm();
                }

                // Помилка зміни пароля
                else if (message.type === "password_change_error") {
                    showAuthError(message.message || "Невідома помилка зміни пароля");
                    document.getElementById("changePasswordButton").disabled = false;
                    updateStatus("Помилка зміни пароля", "error");
                    addSystemMessage("❌ " + (message.message || "Помилка зміни пароля"));
                }

                // Успішна авторизація
                else if (message.type === "auth_success") {
                    isAuthenticated = true;
                    hideAuthOverlay();
                    setInputEnabled(true);
                    updateStatus("Підключено", "connected");
                    addSystemMessage("🎉 Авторизація успішна! Ласкаво просимо до чату");

                    // Автоматичний фокус на поле вводу
                    setTimeout(() => {
                        document.getElementById("messageText").focus();
                    }, 100);
                }

                // Зашифроване повідомлення
                else if (message.type === "encrypted_message") {
                    if (!isAuthenticated) {
                        console.warn("Отримано повідомлення до авторизації");
                        return;
                    }

                    const plaintext = await decryptText(message.data);
                    addMessage(plaintext, "received");
                }

                // Системне повідомлення
                else if (message.type === "system_message") {
                    if (!isAuthenticated) {
                        console.warn("Отримано системне повідомлення до авторизації");
                        return;
                    }

                    const plaintext = await decryptText(message.data);

                    if (message.event === "connected") {
                        addSystemMessage("🟢 " + plaintext);
                    } else if (message.event === "disconnected") {
                        addSystemMessage("🔴 " + plaintext);
                    } else {
                        addSystemMessage("ℹ️ " + plaintext);
                    }
                }

                // Помилка
                else if (message.type === "error") {
                    showError(message.message);
                }

            } catch (error) {
                console.error("Помилка обробки повідомлення:", error);
                showError("Помилка обробки: " + error.message);
            }
        };

        ws.onerror = function(error) {
            updateStatus("Помилка WebSocket", "error");
            showError("Помилка з'єднання WebSocket");
            console.error("Помилка WebSocket:", error);
        };

        ws.onclose = function(event) {
            updateStatus("Відключено", "error");
            setInputEnabled(false);
            isAuthenticated = false;

            if (event.code === 1008) {
                showError("З'єднання закрито через порушення політики");
                addSystemMessage("⚠️ З'єднання закрито сервером (порушення політики)");
            } else {
                addSystemMessage("⚠️ З'єднання закрито");
            }
        };

        // ============================================================
        // Відправка повідомлення
        // ============================================================

        async function sendMessage(event) {
            event.preventDefault();

            if (!isAuthenticated) {
                showError("Необхідно авторизуватися");
                return;
            }

            const input = document.getElementById("messageText");
            const text = input.value.trim();

            if (!text || !aesKey) return;

            try {
                const encryptedData = await encryptText(text);

                ws.send(JSON.stringify({
                    type: "encrypted_message",
                    data: encryptedData
                }));

                addMessage(text, "sent");
                input.value = "";
                input.focus();

            } catch (error) {
                showError("Помилка шифрування: " + error.message);
                console.error(error);
            }
        }

        // Enter для відправки форм авторизації
        document.getElementById("passwordInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                sendAuthorization();
            }
        });

        document.getElementById("confirmPasswordInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                sendPasswordChange();
            }
        });
    </script>
</body>
